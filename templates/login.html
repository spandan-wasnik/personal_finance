{% extends "base.html" %}

{% block title %}Sign In - FinanceAnalyzer{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Enter your credentials to access your dashboard</p>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>
            <div class="form-group" style="margin-bottom: 22px;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>
        <p style="margin-top: 20px; text-align: center; font-size: 13.5px; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create one here</a>
        </p>
    </div>
</div>
{% endblock %}
