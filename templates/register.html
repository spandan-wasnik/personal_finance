{% extends "base.html" %}

{% block title %}Create Account - FinanceAnalyzer{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Create an Account</h2>
        <p class="subtitle">Start tracking your personal finances and budget</p>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group" style="margin-bottom: 14px;">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Your full name">
            </div>
            <div class="form-group" style="margin-bottom: 14px;">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>
            <div class="form-group" style="margin-bottom: 14px;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Minimum 6 characters">
            </div>
            <div class="form-group" style="margin-bottom: 22px;">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
        </form>
        <p style="margin-top: 20px; text-align: center; font-size: 13.5px; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign in here</a>
        </p>
    </div>
</div>
{% endblock %}
